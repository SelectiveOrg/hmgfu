[pytest]
# 90.O: the suite collects `tests/` only. A git worktree under scratch/ (the A/B arms this phase runs) carries a full
# copy of the tree, and pytest's rootdir collection then imports two modules with the same name and fails ~100 tests
# with collection errors that look like breakage and are not. scratch/ is throwaway by design and gitignored.
testpaths = tests
norecursedirs = scratch outputs .venv .git web
